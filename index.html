<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Fit Tracker</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#edf3ff;font:16px system-ui,-apple-system,sans-serif}header,main{max-width:760px;margin:auto;padding:18px}h1{margin:0;font-size:27px}h2{font-size:21px}h3{margin:0 0 6px}p,small{color:#aabbd3}nav{display:flex;position:sticky;top:0;background:#16243a;z-index:3;overflow:auto}nav button{flex:1;background:none;border:0;padding:16px 7px;color:#c5d5e9;font-weight:600}nav button.on{border-bottom:3px solid #4ca8ff;color:white}.card{background:#17263c;border:1px solid #31465f;border-radius:15px;padding:16px;margin:12px 0}.line{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}input,select{background:#0c1729;color:white;border:1px solid #536681;border-radius:8px;padding:9px;font:inherit;max-width:100%}input[type=number]{width:80px}input[type=checkbox]{width:22px;height:22px;accent-color:#5faeff}button{cursor:pointer}button.primary{background:#247be7;color:white;border:0;border-radius:9px;padding:11px 14px;font-weight:bold}.set{display:grid;grid-template-columns:22px 1fr 1fr 24px;align-items:center;gap:8px;margin:10px 0}.exercise{padding:15px 0;border-top:1px solid #344960}.exercise:first-child{border-top:0}.muted{color:#aabbd3}.big{font-size:25px;font-weight:700}#timer{display:inline-block;padding:9px;background:#30445e;border-radius:8px}</style></head><body><header><small>FIT TRACKER</small><h1>Ton suivi quotidien</h1><p>Musculation · Repas · Poids · Récupération</p></header><nav id="nav"></nav><main id="app">Chargement de l’application…</main><script>
(function(){'use strict';
var plans=[
['Upper A','Mercredi',[['Développé incliné Smith','Pronation · 3 × 6–10',180,3],['Tirage vertical','Pronation · 3 × 8–12',120,3],['Écartés poulie','Neutre · 2 × 10–15',90,2],['Rowing poulie basse','Triangle neutre · 3 × 8–12',120,3],['Élévations latérales','Neutre · 2 × 12–20',90,2],['Curl classique','Supination · 2 × 10–15',90,2],['Extension triceps corde','Neutre · 2 × 10–15',90,2]]],
['Lower A','Vendredi',[['Presse à cuisses','3 × 8–12',180,3],['Leg curl','3 × 10–15',120,3],['Leg extension','3 × 10–15',120,3],['Mollets','3 × 10–15',90,3],['Crunch poulie','2 × 10–15',90,2]]],
['Upper B','Samedi',[['Développé couché Smith','Pronation · 3 × 6–10',180,3],['Rowing poulie basse','Pronation · 3 × 8–12',120,3],['Tirage vertical','Neutre · 3 × 8–12',120,3],['Écartés poulie','Neutre · 2 × 12–15',90,2],['Élévations latérales','Neutre · 2 × 12–20',90,2],['Curl incliné','Supination · 2 × 10–15',90,2],['Extension triceps barre','Pronation · 2 × 10–15',90,2]]],
['Lower B','Dimanche',[['Squat Smith','3 × 8–12',180,3],['Leg curl','3 × 10–15',120,3],['Leg extension','2 × 12–15',120,2],['Mollets','3 × 10–15',90,3],['Gainage','2 × 30–60 s',90,2],['RDL optionnel','Léger · 2 × 10–12',180,2]]]];
var state={meals:{},mealNames:['Petit-déjeuner','Déjeuner','Collation','Dîner'],weights:[],recovery:[],sessions:[],drafts:{}},tab='today',plan=0,timerEnd=0;try{var s=JSON.parse(localStorage.getItem('fittracker-v1')||'null');if(s&&s.meals&&s.sessions)state=Object.assign(state,s)}catch(e){}
function day(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function save(){try{localStorage.setItem('fittracker-v1',JSON.stringify(state))}catch(e){alert('Stockage local indisponible : exporte tes données.')}}function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function key(){return day()+'|'+plan}function draft(){if(!state.drafts[key()])state.drafts[key()]={sets:{},feel:'Adapté'};return state.drafts[key()]}
function today(){var m=state.meals[day()]||{},w=state.weights.slice().sort(function(a,b){return b.date.localeCompare(a.date)})[0];return '<h2>Aujourd’hui</h2><div class="card"><h3>Poids</h3><div class="big">'+(w?esc(w.value)+' kg':'—')+'</div><div class="row"><input id="weight" type="number" step=".1" placeholder="kg"><button class="primary" data-act="weight">Enregistrer</button></div></div><div class="card"><h3>Repas du jour</h3>'+state.mealNames.map(function(n,i){return '<div class="line"><label><input type="checkbox" data-meal="'+i+'" '+(m[i]?'checked':'')+'> '+esc(n)+'</label><small>'+(m[i]?'Pris':'À prendre')+'</small></div>'}).join('')+'<small>Repas coché = repas déclaré pris, pas calories vérifiées.</small></div><div class="card"><h3>Récupération</h3><div class="line"><label>Sommeil (h)</label><input id="sleep" type="number" step=".5" min="0" max="24"></div><div class="line"><label>Énergie</label><select id="energy">'+[1,2,3,4,5].map(function(n){return '<option '+(n===3?'selected':'')+'>'+n+'</option>'}).join('')+'</select></div><div class="line"><label>Fatigue mentale</label><select id="fatigue">'+[1,2,3,4,5].map(function(n){return '<option '+(n===3?'selected':'')+'>'+n+'</option>'}).join('')+'</select></div><button class="primary" data-act="recovery">Enregistrer</button></div>'}
function gym(){var p=plans[plan],d=draft();return '<h2>Musculation</h2><div class="card"><select id="plan">'+plans.map(function(x,i){return '<option value="'+i+'" '+(i===plan?'selected':'')+'>'+x[1]+' · '+x[0]+'</option>'}).join('')+'</select><p>Consigne : garder environ 2 répétitions en réserve. RIR non obligatoire.</p><span id="timer">Repos : prêt</span> <button data-act="stop">Arrêter</button></div><div class="card">'+p[2].map(function(e,i){return '<section class="exercise"><h3>'+esc(e[0])+'</h3><small>'+esc(e[1])+' · Repos '+Math.round(e[2]/30)/2+' min</small>'+Array.from({length:e[3]},function(_,j){var k=i+'-'+j,v=d.sets[k]||{};return '<div class="set"><small>'+(j+1)+'</small><input type="number" step=".5" placeholder="kg" aria-label="Charge" data-key="'+k+'" data-field="kg" value="'+esc(v.kg||'')+'"><input type="number" placeholder="reps" aria-label="Répétitions" data-key="'+k+'" data-field="reps" value="'+esc(v.reps||'')+'"><input type="checkbox" aria-label="Série terminée" data-done="'+k+'" '+(v.done?'checked':'')+'></div>'}).join('')+'</section>'}).join('')+'<div class="line"><label>Ressenti de la séance</label><select id="feel">'+['Facile','Adapté','Trop difficile'].map(function(x){return '<option '+(x===d.feel?'selected':'')+'>'+x+'</option>'}).join('')+'</select></div><button class="primary" data-act="finish">Terminer et sauvegarder</button></div>'}
function history(){return '<h2>Historique</h2><div class="card"><h3>Pesées</h3>'+(state.weights.length?state.weights.slice().reverse().map(function(x){return '<div class="line">'+esc(x.date)+' <b>'+esc(x.value)+' kg</b></div>'}).join(''):'Aucune pesée')+'</div><div class="card"><h3>Séances</h3>'+(state.sessions.length?state.sessions.slice().reverse().map(function(s){return '<section class="exercise"><b>'+esc(s.date)+' · '+esc(s.name)+'</b><p>'+esc(s.feel)+'</p>'+Object.keys(s.sets).filter(function(k){return s.sets[k].done}).map(function(k){var a=k.split('-');return '<small>'+esc(plans[s.plan][2][+a[0]][0])+' S'+(+a[1]+1)+' : '+esc(s.sets[k].kg||'—')+' kg × '+esc(s.sets[k].reps||'—')+'</small><div></div>'}).join('')+'</section>'}).join(''):'Aucune séance')+'</div><div class="card"><h3>Récupération</h3>'+state.recovery.slice().reverse().map(function(x){return '<p>'+esc(x.date)+' · '+esc(x.sleep)+' h · énergie '+esc(x.energy)+'/5 · fatigue '+esc(x.fatigue)+'/5</p>'}).join('')+'</div>'}
function settings(){return '<h2>Réglages</h2><div class="card"><h3>Nom des repas</h3>'+state.mealNames.map(function(n,i){return '<div class="line"><label>Repas '+(i+1)+'</label><input data-name="'+i+'" value="'+esc(n)+'"></div>'}).join('')+'<button class="primary" data-act="names">Enregistrer</button></div><div class="card"><h3>Sauvegarde</h3><p>Stockage local sur cet appareil. Exporte régulièrement tes données.</p><button class="primary" data-act="export">Exporter JSON</button><p><input id="import" type="file" accept=".json,application/json"></p></div>'}
function render(){document.getElementById('nav').innerHTML=[['today','Aujourd’hui'],['gym','Musculation'],['history','Historique'],['settings','Réglages']].map(function(t){return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('');document.getElementById('app').innerHTML=tab==='today'?today():tab==='gym'?gym():tab==='history'?history():settings();tick()}
function tick(){var e=document.getElementById('timer');if(e){var s=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));e.textContent=s?'Repos : '+Math.floor(s/60)+':'+('0'+s%60).slice(-2):'Repos : prêt'}}
document.addEventListener('click',function(ev){var t=ev.target.closest('[data-tab],[data-act]');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;render();return}var a=t.dataset.act;if(a==='weight'){var v=+document.getElementById('weight').value;if(!(v>=20&&v<=350))return alert('Poids invalide');state.weights=state.weights.filter(function(x){return x.date!==day()});state.weights.push({date:day(),value:v})}if(a==='recovery'){var h=document.getElementById('sleep').value;if(h===''||+h<0||+h>24)return alert('Sommeil invalide');state.recovery=state.recovery.filter(function(x){return x.date!==day()});state.recovery.push({date:day(),sleep:+h,energy:document.getElementById('energy').value,fatigue:document.getElementById('fatigue').value})}if(a==='stop'){timerEnd=0;tick();return}if(a==='finish'){var d=draft();state.sessions.push({date:day(),name:plans[plan][0],plan:plan,sets:JSON.parse(JSON.stringify(d.sets)),feel:d.feel});delete state.drafts[key()];tab='history';alert('Séance sauvegardée')}if(a==='names')document.querySelectorAll('[data-name]').forEach(function(e){state.mealNames[+e.dataset.name]=e.value||'Repas'});if(a==='export'){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='fit-tracker-'+day()+'.json';link.click();setTimeout(function(){URL.revokeObjectURL(u)},1000);return}save();render()});
document.addEventListener('change',function(ev){var t=ev.target;if(t.id==='plan'){plan=+t.value;render();return}if(t.dataset.meal!==undefined){if(!state.meals[day()])state.meals[day()]={};state.meals[day()][t.dataset.meal]=t.checked;save();render();return}if(t.dataset.key){var d=draft(),k=t.dataset.key;if(!d.sets[k])d.sets[k]={};d.sets[k][t.dataset.field]=t.value;save();return}if(t.dataset.done!==undefined){var d=draft(),k=t.dataset.done;if(!d.sets[k])d.sets[k]={};d.sets[k].done=t.checked;if(t.checked)timerEnd=Date.now()+plans[plan][2][+k.split('-')[0]][2]*1000;save();tick();return}if(t.id==='feel'){draft().feel=t.value;save()}if(t.id==='import'&&t.files[0]){var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o.meals||!o.sessions||!o.weights)throw Error();if(confirm('Remplacer les données locales ?')){state=o;save();render()}}catch(e){alert('Sauvegarde invalide')}};r.readAsText(t.files[0])}});
setInterval(tick,1000);render()})();
</script></body></html>
