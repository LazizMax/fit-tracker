<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Fit Tracker</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#edf3ff;font:16px system-ui,-apple-system,sans-serif}header,main{max-width:760px;margin:auto;padding:18px}h1{margin:0;font-size:27px}h2{font-size:21px}h3{margin:0 0 6px}p,small{color:#aabbd3}nav{display:flex;position:sticky;top:0;background:#16243a;z-index:3;overflow:auto}nav button{flex:1;background:none;border:0;padding:16px 7px;color:#c5d5e9;font-weight:600}nav button.on{border-bottom:3px solid #4ca8ff;color:white}.card{background:#17263c;border:1px solid #31465f;border-radius:15px;padding:16px;margin:12px 0}.line{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}input,select{background:#0c1729;color:white;border:1px solid #536681;border-radius:8px;padding:9px;font:inherit;max-width:100%}input[type=number]{width:80px}input[type=checkbox]{width:22px;height:22px;accent-color:#5faeff}button{cursor:pointer}button.primary{background:#247be7;color:white;border:0;border-radius:9px;padding:11px 14px;font-weight:bold}.set{display:grid;grid-template-columns:22px 1fr 1fr 24px;align-items:center;gap:8px;margin:10px 0}.exercise{padding:15px 0;border-top:1px solid #344960}.exercise:first-child{border-top:0}.muted{color:#aabbd3}.big{font-size:25px;font-weight:700}#timer{display:inline-block;padding:9px;background:#30445e;border-radius:8px}</style></head><body><header><small>FIT TRACKER · v2026.10.18-4</small><h1>Ton suivi quotidien</h1><p>Musculation · Repas · Poids · Récupération</p></header><nav id="nav"></nav><main id="app">Chargement de l’application…</main><script>

['Lower A','Vendredi',[['Presse à cuisses','3 × 8–12',180,3],['Leg curl','3 × 10–15',120,3],['Leg extension','3 × 10–15',120,3],['Mollets','3 × 10–15',90,3],['Crunch poulie','2 × 10–15',90,2]]],
['Upper B','Samedi',[['Développé couché Smith','Pronation · 3 × 6–10',180,3],['Rowing poulie basse','Pronation · 3 × 8–12',120,3],['Tirage vertical','Neutre · 3 × 8–12',120,3],['Écartés poulie','Neutre · 2 × 12–15',90,2],['Élévations latérales','Neutre · 2 × 12–20',90,2],['Curl incliné','Supination · 2 × 10–15',90,2],['Extension triceps barre','Pronation · 2 × 10–15',90,2]]],
['Lower B','Dimanche',[['Squat Smith','3 × 8–12',180,3],['Leg curl','3 × 10–15',120,3],['Leg extension','2 × 12–15',120,2],['Mollets','3 × 10–15',90,3],['Gainage','2 × 30–60 s',90,2],['RDL optionnel','Léger · 2 × 10–12',180,2]]]];
var state={meals:{},mealNames:['Petit-déjeuner','Déjeuner','Collation','Dîner'],weights:[],recovery:[],sessions:[],drafts:{},walks:{}},tab='today',plan=0,timerEnd=0;try{var s=JSON.parse(localStorage.getItem('fittracker-v1')||'null');if(s&&s.meals&&s.sessions)state=Object.assign(state,s)}catch(e){}
var LBKG=0.45359237;function unit(){return state.settings&&state.settings.unit==='lb'?'lb':'kg'}function exerciseUnit(name){return state.exerciseUnits&&state.exerciseUnits[name]==='lb'?'lb':'kg'}function showLoad(kg,u){return kg===''||kg==null?'':Math.round(Number(kg)/((u||unit())==='lb'?LBKG:1)*100)/100}function storeLoad(v,u){return v===''?'':Math.round(Number(v)*((u||unit())==='lb'?LBKG:1)*100000)/100000}function displayLoad(v,n){return fmt(Number(v)/(unit()==='lb'?LBKG:1),n)}

function save(){try{localStorage.setItem('fittracker-v1',JSON.stringify(state))}catch(e){alert('Stockage local indisponible : exporte tes données.')}}function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function key(){return day()+'|'+plan}function draft(){if(!state.drafts[key()])state.drafts[key()]={sets:{},feel:'Adapté'};return state.drafts[key()]}
function walking(){var w=(state.walks||{})[day()]||{};return '<div class="card"><h3>🚶 Marche quotidienne</h3><div class="line"><label><input id="walk-done" type="checkbox" '+(w.done?'checked':'')+'> Marche effectuée</label></div><div class="line"><label>Durée (minutes)</label><input id="walk-minutes" type="number" min="0" max="600" step="1" value="'+esc(w.minutes??'')+'"></div><div class="line"><label>Calories actives (kcal)</label><input id="walk-calories" type="number" min="0" max="3000" step="1" value="'+esc(w.calories??'')+'"></div><div class="line"><label>Nombre de pas (optionnel)</label><input id="walk-steps" type="number" min="0" max="100000" step="1" value="'+esc(w.steps??'')+'"></div><div class="line"><label>Source</label><select id="walk-source">'+['Tapis','Montre','Application','Estimation'].map(function(x){return '<option '+(x===(w.source||'Tapis')?'selected':'')+'>'+x+'</option>'}).join('')+'</select></div><button class="primary" data-act="walk">Enregistrer la marche</button><p><small>Calories estimées, non ajoutées automatiquement à ton budget alimentaire.</small></p></div>'}
var analysisView='weight',analysisExercise=0,analysisPeriod=30;
function isoDate(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function daysAgo(n){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return isoDate(d)}
function weekStart(x){var d=new Date(x+'T12:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return isoDate(d)}
function fmt(x,n){return Number.isFinite(x)?x.toFixed(n===undefined?1:n).replace('.',','):'—'}
function graph(items,unit){if(!items.length)return '<p>Aucune donnée pour cette période.</p>';var values=items.map(function(x){return x.v}).filter(Number.isFinite);if(!values.length)return '<p>Aucune donnée.</p>';var min=Math.min.apply(null,values),max=Math.max.apply(null,values),spread=max-min||1;min-=spread*.12;max+=spread*.12;var w=320,ht=140,coords=items.map(function(x,i){return [12+i*(w-24)/Math.max(1,items.length-1),ht-15-(x.v-min)/(max-min)*(ht-30)]});return '<svg viewBox="0 0 320 160" role="img" aria-label="Évolution '+esc(unit)+'" style="width:100%;height:auto;overflow:visible"><line x1="12" y1="140" x2="308" y2="140" stroke="#536681"/><polyline points="'+coords.map(function(p){return p.join(',')}).join(' ')+'" fill="none" stroke="#59b1ff" stroke-width="2.5" stroke-linejoin="round"/>'+coords.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.5" fill="#a4d6ff"/>'}).join('')+'<text x="12" y="10" fill="#aabbd3" font-size="10">'+fmt(max,1)+' '+esc(unit)+'</text><text x="12" y="154" fill="#aabbd3" font-size="10">'+esc(items[0].d)+'</text><text x="308" y="154" text-anchor="end" fill="#aabbd3" font-size="10">'+esc(items[items.length-1].d)+'</text></svg>'}
function statsGrid(a){return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+a.map(function(x){return '<div style="background:#0e1b30;border-radius:10px;padding:12px"><small>'+esc(x[0])+'</small><div class="big" style="font-size:20px">'+esc(x[1])+'</div></div>'}).join('')+'</div>'}
function weightAnalysis(){var a=state.weights.slice().filter(function(x){return x.date>=daysAgo(analysisPeriod-1)&&Number.isFinite(Number(x.value))}).sort(function(a,b){return a.date.localeCompare(b.date)}),all=state.weights.slice().filter(function(x){return Number.isFinite(Number(x.value))}).sort(function(a,b){return a.date.localeCompare(b.date)});var points=a.map(function(x){var window=all.filter(function(z){return z.date<=x.date&&z.date>=isoDate(new Date(new Date(x.date+'T12:00:00').getTime()-6*86400000))});return {d:x.date.slice(5),v:window.reduce(function(t,z){return t+Number(z.value)},0)/window.length}});var current=points.length?points[points.length-1].v:NaN,previous=points.length>1?points[0].v:NaN,delta=current-previous;return '<div class="card"><h3>Poids et tendance</h3>'+statsGrid([['Dernière moyenne 7 j',fmt(current)+' kg'],['Évolution période',fmt(delta)+' kg'],['Objectif','80 kg'],['Pesées période',a.length]])+graph(points,'kg')+'<small>Courbe : moyenne des pesées disponibles sur les 7 jours précédents. Les variations quotidiennes ne reflètent pas uniquement la masse grasse.</small></div>'}
function sessionsInPeriod(){return state.sessions.filter(function(s){return s.date>=daysAgo(analysisPeriod-1)})}
function exerciseAnalysis(){var names=[];plans.forEach(function(p){p[2].forEach(function(ex){if(names.indexOf(ex[0])<0)names.push(ex[0])})});var name=names[analysisExercise]||names[0],items=[];sessionsInPeriod().forEach(function(s){var exList=plans[s.plan]&&plans[s.plan][2];if(!exList)return;var rows=Object.keys(s.sets||{}).filter(function(k){var idx=Number(k.split('-')[0]);return exList[idx]&&exList[idx][0]===name&&s.sets[k].done}).map(function(k){return s.sets[k]});if(!rows.length)return;var valid=rows.filter(function(x){return Number(x.kg)>0&&Number(x.reps)>0});if(!valid.length)return;items.push({d:s.date.slice(5),v:Math.max.apply(null,valid.map(function(x){return Number(x.kg)*(1+Number(x.reps)/30)})),ton:valid.reduce(function(t,x){return t+Number(x.kg)*Number(x.reps)},0),sets:rows.length})});items.sort(function(a,b){return a.d.localeCompare(b.d)});return '<div class="card"><h3>Performance par exercice</h3><label>Exercice</label><select id="analysis-exercise" style="width:100%">'+names.map(function(n,i){return '<option value="'+i+'" '+(i===analysisExercise?'selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select>'+statsGrid([['Séances mesurées',items.length],['Meilleur e1RM',items.length?displayLoad(Math.max.apply(null,items.map(function(x){return x.v})))+' '+unit():'—'],['Dernier tonnage',items.length?displayLoad(items[items.length-1].ton,0)+' '+unit():'—'],['Dernières séries',items.length?items[items.length-1].sets:'—']])+graph(items.map(function(x){return {d:x.d,v:x.v/(unit()==='lb'?LBKG:1)}}),unit()+' e1RM')+'<small>e1RM = charge × (1 + répétitions/30), estimation indicative. Comparer seulement le même exercice et le même matériel. Le gainage n’est pas comparable.</small></div>'}
function volumeAnalysis(){var byWeek={};sessionsInPeriod().forEach(function(s){var wk=weekStart(s.date);if(!byWeek[wk])byWeek[wk]={sets:0,ton:0,sessions:0};byWeek[wk].sessions++;Object.keys(s.sets||{}).forEach(function(k){var x=s.sets[k];if(!x.done)return;byWeek[wk].sets++;if(Number(x.kg)>0&&Number(x.reps)>0)byWeek[wk].ton+=Number(x.kg)*Number(x.reps)})});var a=Object.keys(byWeek).sort().map(function(k){return {d:k.slice(5),v:byWeek[k].sets,ton:byWeek[k].ton,sessions:byWeek[k].sessions}});return '<div class="card"><h3>Volume hebdomadaire</h3>'+statsGrid([['Séries terminées',a.reduce(function(t,x){return t+x.v},0)],['Séances réalisées',a.reduce(function(t,x){return t+x.sessions},0)],['Tonnage total',displayLoad(a.reduce(function(t,x){return t+x.ton},0),0)+' '+unit()],['Semaines actives',a.length]])+graph(a,'séries')+'<small>Séries terminées uniquement. Le tonnage n’inclut pas les séries sans charge ou répétitions renseignées.</small></div>'}
function recoveryAnalysis(){var a=state.recovery.filter(function(x){return x.date>=daysAgo(analysisPeriod-1)}),mean=function(k){var v=a.map(function(x){return Number(x[k])}).filter(Number.isFinite);return v.length?fmt(v.reduce(function(t,x){return t+x},0)/v.length):'—'};return '<div class="card"><h3>Récupération</h3>'+statsGrid([['Sommeil moyen',mean('sleep')+' h'],['Énergie moyenne',mean('energy')+'/5'],['Fatigue mentale',mean('fatigue')+'/5'],['Jours renseignés',a.length]])+graph(a.slice().sort(function(x,y){return x.date.localeCompare(y.date)}).map(function(x){return {d:x.date.slice(5),v:Number(x.sleep)}}),'h sommeil')+'</div>'}
function walkingAnalysis(){var walks=state.walks||{},dates=[];for(var i=analysisPeriod-1;i>=0;i--)dates.push(daysAgo(i));var rows=dates.map(function(d){return {d:d,v:walks[d]||null}}),filled=rows.filter(function(x){return x.v!==null}),sum=function(k){return filled.reduce(function(t,x){return t+(Number(x.v[k])||0)},0)};return '<div class="card"><h3>Marche et calories actives</h3>'+statsGrid([['Marches effectuées',filled.filter(function(x){return x.v.done}).length+' / '+analysisPeriod+' jours'],['Calories déclarées',sum('calories')+' kcal'],['Durée cumulée',sum('minutes')+' min'],['Pas déclarés',sum('steps')]])+graph(filled.filter(function(x){return x.v.calories!==null}).map(function(x){return {d:x.d.slice(5),v:Number(x.v.calories)}}),'kcal')+'<small>Calories estimées selon la source renseignée. Jours non saisis exclus de la courbe, mais comptés dans la période.</small></div>'}
function adherenceAnalysis(){var a=sessionsInPeriod(),dates=[];for(var i=analysisPeriod-1;i>=0;i--)dates.push(daysAgo(i));var planned=dates.filter(function(d){return [0,3,5,6].includes(new Date(d+'T12:00:00').getDay())}).length,meals=dates.reduce(function(t,d){var m=state.meals[d]||{};return t+Object.keys(m).filter(function(k){return m[k]}).length},0);return '<div class="card"><h3>Régularité</h3>'+statsGrid([['Séances réalisées',a.length+' / '+planned],['Repas cochés',meals+' / '+analysisPeriod*state.mealNames.length],['Pesées',state.weights.filter(function(x){return x.date>=daysAgo(analysisPeriod-1)}).length],['Marches cochées',Object.keys(state.walks||{}).filter(function(d){return d>=daysAgo(analysisPeriod-1)&&state.walks[d].done}).length]])+'<small>Le planning cible mercredi, vendredi, samedi et dimanche. Les repas cochés indiquent uniquement la déclaration de prise.</small></div>'}
function analysis(){var sections=[['weight','Poids'],['performance','Performance'],['volume','Volume'],['recovery','Récupération'],['walking','Marche'],['adherence','Régularité']];return '<h2>Analyse</h2><div class="card"><div class="row">'+sections.map(function(x){return '<button data-analysis="'+x[0]+'" class="'+(analysisView===x[0]?'primary':'')+'">'+x[1]+'</button>'}).join('')+'</div><div class="row" style="margin-top:12px"><label>Période</label><select id="analysis-period">'+[7,30,90,365].map(function(n){return '<option value="'+n+'" '+(n===analysisPeriod?'selected':'')+'>'+n+' jours</option>'}).join('')+'</select></div></div>'+(analysisView==='weight'?weightAnalysis():analysisView==='performance'?exerciseAnalysis():analysisView==='volume'?volumeAnalysis():analysisView==='recovery'?recoveryAnalysis():analysisView==='walking'?walkingAnalysis():adherenceAnalysis())}
function today(){var m=state.meals[day()]||{},w=state.weights.slice().sort(function(a,b){return b.date.localeCompare(a.date)})[0];return '<h2>Aujourd’hui</h2><div class="card"><h3>Poids</h3><div class="big">'+(w?esc(w.value)+' kg':'—')+'</div><div class="row"><input id="weight" type="number" step=".1" placeholder="kg"><button class="primary" data-act="weight">Enregistrer</button></div></div><div class="card"><h3>Repas du jour</h3>'+state.mealNames.map(function(n,i){return '<div class="line"><label><input type="checkbox" data-meal="'+i+'" '+(m[i]?'checked':'')+'> '+esc(n)+'</label><small>'+(m[i]?'Pris':'À prendre')+'</small></div>'}).join('')+'<small>Repas coché = repas déclaré pris, pas calories vérifiées.</small></div>'+walking()+'<div class="card"><h3>Récupération</h3><div class="line"><label>Sommeil (h)</label><input id="sleep" type="number" step=".5" min="0" max="24"></div><div class="line"><label>Énergie</label><select id="energy">'+[1,2,3,4,5].map(function(n){return '<option '+(n===3?'selected':'')+'>'+n+'</option>'}).join('')+'</select></div><div class="line"><label>Fatigue mentale</label><select id="fatigue">'+[1,2,3,4,5].map(function(n){return '<option '+(n===3?'selected':'')+'>'+n+'</option>'}).join('')+'</select></div><button class="primary" data-act="recovery">Enregistrer</button></div>'}
function gym(){var p=plans[plan],d=draft();return '<h2>Musculation</h2><p><small>Choisis kg ou lb pour chaque exercice. Les analyses utilisent l’unité définie dans Réglages.</small></p><div class="card"><select id="plan">'+plans.map(function(x,i){return '<option value="'+i+'" '+(i===plan?'selected':'')+'>'+x[1]+' · '+x[0]+'</option>'}).join('')+'</select><p>Consigne : garder environ 2 répétitions en réserve. RIR non obligatoire.</p><span id="timer">Repos : prêt</span> <button data-act="stop">Arrêter</button></div><div class="card">'+p[2].map(function(e,i){return '<section class="exercise"><div class="line"><h3>'+esc(e[0])+'</h3><select data-exercise-unit="'+i+'" aria-label="Unité de '+esc(e[0])+'"><option value="kg" '+(exerciseUnit(e[0])==='kg'?'selected':'')+'>kg</option><option value="lb" '+(exerciseUnit(e[0])==='lb'?'selected':'')+'>lb</option></select></div><small>'+esc(e[1])+' · Repos '+Math.round(e[2]/30)/2+' min</small>'+Array.from({length:e[3]},function(_,j){var k=i+'-'+j,v=d.sets[k]||{};return '<div class="set"><small>'+(j+1)+'</small><input type="number" step=".5" placeholder="'+exerciseUnit(e[0])+'" aria-label="Charge" data-key="'+k+'" data-field="kg" value="'+esc(showLoad(v.kg,exerciseUnit(e[0])))+'"><input type="number" placeholder="reps" aria-label="Répétitions" data-key="'+k+'" data-field="reps" value="'+esc(v.reps||'')+'"><input type="checkbox" aria-label="Série terminée" data-done="'+k+'" '+(v.done?'checked':'')+'></div>'}).join('')+'</section>'}).join('')+'<div class="line"><label>Ressenti de la séance</label><select id="feel">'+['Facile','Adapté','Trop difficile'].map(function(x){return '<option '+(x===d.feel?'selected':'')+'>'+x+'</option>'}).join('')+'</select></div><button class="primary" data-act="finish">Terminer et sauvegarder</button></div>'}
function history(){return '<h2>Historique</h2><div class="card"><h3>Pesées</h3>'+(state.weights.length?state.weights.slice().reverse().map(function(x){return '<div class="line">'+esc(x.date)+' <b>'+esc(x.value)+' kg</b></div>'}).join(''):'Aucune pesée')+'</div><div class="card"><h3>Séances</h3>'+(state.sessions.length?state.sessions.slice().reverse().map(function(s){return '<section class="exercise"><b>'+esc(s.date)+' · '+esc(s.name)+'</b><p>'+esc(s.feel)+'</p>'+Object.keys(s.sets).filter(function(k){return s.sets[k].done}).map(function(k){var a=k.split('-');return '<small>'+esc(plans[s.plan][2][+a[0]][0])+' S'+(+a[1]+1)+' : '+esc(s.sets[k].kg==null||s.sets[k].kg===''?'—':showLoad(s.sets[k].kg))+' '+unit()+' × '+esc(s.sets[k].reps||'—')+'</small><div></div>'}).join('')+'</section>'}).join(''):'Aucune séance')+'</div><div class="card"><h3>Récupération</h3>'+state.recovery.slice().reverse().map(function(x){return '<p>'+esc(x.date)+' · '+esc(x.sleep)+' h · énergie '+esc(x.energy)+'/5 · fatigue '+esc(x.fatigue)+'/5</p>'}).join('')+'</div>'}
function settings(){return '<h2>Réglages</h2><div class="card"><h3>Unité pour les analyses</h3><select id="gym-unit"><option value="kg" '+(unit()==='kg'?'selected':'')+'>Kilogrammes (kg)</option><option value="lb" '+(unit()==='lb'?'selected':'')+'>Livres (lb)</option></select></div><div class="card"><h3>Nom des repas</h3>'+state.mealNames.map(function(n,i){return '<div class="line"><label>Repas '+(i+1)+'</label><input data-name="'+i+'" value="'+esc(n)+'"></div>'}).join('')+'<button class="primary" data-act="names">Enregistrer</button></div><div class="card"><h3>Sauvegarde</h3><p>Stockage local sur cet appareil. Exporte régulièrement tes données.</p><button class="primary" data-act="export">Exporter JSON</button><p><input id="import" type="file" accept=".json,application/json"></p></div>'}
function render(){document.getElementById('nav').innerHTML=[['today','Aujourd’hui'],['gym','Musculation'],['history','Historique'],['analysis','Analyse'],['settings','Réglages']].map(function(t){return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('');document.getElementById('app').innerHTML=tab==='today'?today():tab==='gym'?gym():tab==='history'?history():tab==='analysis'?analysis():settings();tick()}
function tick(){var e=document.getElementById('timer');if(e){var s=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));e.textContent=s?'Repos : '+Math.floor(s/60)+':'+('0'+s%60).slice(-2):'Repos : prêt'}}
document.addEventListener('click',function(ev){var t=ev.target.closest('[data-tab],[data-act]');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;render();return}if(t.dataset.analysis){analysisView=t.dataset.analysis;render();return}var a=t.dataset.act;if(a==='walk'){var minutes=document.getElementById('walk-minutes').value,calories=document.getElementById('walk-calories').value,steps=document.getElementById('walk-steps').value;if([minutes,calories,steps].some(function(x){return x!==''&&(!Number.isFinite(Number(x))||Number(x)<0)}))return alert('Valeurs de marche invalides');if(!state.walks)state.walks={};state.walks[day()]={done:document.getElementById('walk-done').checked,minutes:minutes===''?null:Number(minutes),calories:calories===''?null:Number(calories),steps:steps===''?null:Number(steps),source:document.getElementById('walk-source').value}}if(a==='weight'){var v=+document.getElementById('weight').value;if(!(v>=20&&v<=350))return alert('Poids invalide');state.weights=state.weights.filter(function(x){return x.date!==day()});state.weights.push({date:day(),value:v})}if(a==='recovery'){var h=document.getElementById('sleep').value;if(h===''||+h<0||+h>24)return alert('Sommeil invalide');state.recovery=state.recovery.filter(function(x){return x.date!==day()});state.recovery.push({date:day(),sleep:+h,energy:document.getElementById('energy').value,fatigue:document.getElementById('fatigue').value})}if(a==='stop'){timerEnd=0;tick();return}if(a==='finish'){var d=draft();state.sessions.push({date:day(),name:plans[plan][0],plan:plan,sets:JSON.parse(JSON.stringify(d.sets)),feel:d.feel});delete state.drafts[key()];tab='history';alert('Séance sauvegardée')}if(a==='names')document.querySelectorAll('[data-name]').forEach(function(e){state.mealNames[+e.dataset.name]=e.value||'Repas'});if(a==='export'){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='fit-tracker-'+day()+'.json';link.click();setTimeout(function(){URL.revokeObjectURL(u)},1000);return}save();render()});
document.addEventListener('change',function(ev){var t=ev.target;if(t.dataset.exerciseUnit!==undefined){var ex=plans[plan][2][Number(t.dataset.exerciseUnit)];if(!ex)return;if(!state.exerciseUnits)state.exerciseUnits={};state.exerciseUnits[ex[0]]=t.value;save();render();return}if(t.id==='gym-unit'){if(!state.settings)state.settings={};state.settings.unit=t.value;save();render();return}if(t.id==='plan'){plan=+t.value;render();return}if(t.id==='analysis-period'){analysisPeriod=+t.value;render();return}if(t.id==='analysis-exercise'){analysisExercise=+t.value;render();return}if(t.dataset.meal!==undefined){if(!state.meals[day()])state.meals[day()]={};state.meals[day()][t.dataset.meal]=t.checked;save();render();return}if(t.dataset.key){var d=draft(),k=t.dataset.key;if(!d.sets[k])d.sets[k]={};d.sets[k][t.dataset.field]=t.dataset.field==='kg'?storeLoad(t.value,exerciseUnit(plans[plan][2][Number(k.split('-')[0])][0])):t.value;save();return}if(t.dataset.done!==undefined){var d=draft(),k=t.dataset.done;if(!d.sets[k])d.sets[k]={};d.sets[k].done=t.checked;if(t.checked)timerEnd=Date.now()+plans[plan][2][+k.split('-')[0]][2]*1000;save();tick();return}if(t.id==='feel'){draft().feel=t.value;save()}if(t.id==='import'&&t.files[0]){var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o.meals||!o.sessions||!o.weights)throw Error();if(confirm('Remplacer les données locales ?')){state=o;save();render()}}catch(e){alert('Sauvegarde invalide')}};r.readAsText(t.files[0])}});
try{render()}catch(err){var target=document.getElementById('app');if(target)target.innerHTML='<div class="card"><h2>Erreur de chargement</h2><p>'+esc(err.message)+'</p><small>Aucune donnée n’a été effacée. Transmets cette erreur pour correction.</small></div>';console.error('Fit Tracker startup:',err)}setInterval(function(){try{tick()}catch(e){console.error(e)}},1000)})();
